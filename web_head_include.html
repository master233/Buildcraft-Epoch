<link rel="preload" as="image" href="loader_bg.jpg">
<link rel="preload" as="image" href="loader_logo.png">
<link rel="preload" as="image" href="loader_btn.png">
<link rel="preload" as="font" href="loader_font.ttf" type="font/ttf" crossorigin>
<style>
:root {
	--bce-loader-duration: 5s; /* fallback，实际由 JS 驱动 */
}

@font-face {
	font-family: 'ZCOOLKuaiLe';
	src: url('loader_font.ttf') format('truetype');
	font-display: swap;
}

/* 隐藏 Godot 默认 splash */
#status {
	display: none !important;
}

#bce-loader {
	position: fixed;
	inset: 0;
	z-index: 10;
	background-color: #0d0d26;
	background-image: url("loader_bg.jpg");
	background-size: cover;
	background-position: center;
	transition: opacity 0.45s ease;
}

#bce-loader::before {
	content: "";
	position: absolute;
	inset: 0;
	background-color: rgba(13, 13, 38, 0.5);
	pointer-events: none;
}

#bce-loader.fade-out {
	opacity: 0;
	pointer-events: none !important;
}

/* logo —— 模拟 TitleScreen.gd 中 logo 中心 y=35.6%（256.5/720）、视觉高度约 680/720=94vh */
#bce-logo-pos {
	position: absolute;
	top: 35.6%;
	left: 50%;
	transform: translate(-50%, -50%);
	pointer-events: none;
}

#bce-logo {
	display: block;
	height: 94vh;
	width: auto;
	max-width: 95vw;
	animation: bce-logo-pulse 3.2s ease-in-out infinite;
	filter: drop-shadow(0 0 32px rgba(255, 220, 120, 0.4));
}

@keyframes bce-logo-pulse {
	0%, 100% { transform: scale(1.0); }
	50%      { transform: scale(1.025); }
}

/* 进度条 —— 复刻 LoadingScreen 进度条样式（600x24, 棕边金填充, 12 圆角） */
#bce-progress-pos {
	position: absolute;
	bottom: 70px;     /* LoadingScreen.gd: position.y = vp.y - 70 */
	left: 50%;
	transform: translateX(-50%);
	width: min(83.3vw, 148vh);   /* 600/720 ≈ 0.833 */
	max-width: 600px;
	min-width: 360px;
}

#bce-progress {
	position: relative;
	width: 100%;
	height: 24px;     /* LoadingScreen.gd BAR_HEIGHT = 24 */
	background-color: rgba(13, 10, 5, 0.75);   /* Color(0.05, 0.04, 0.02, 0.75) */
	border: 2px solid rgba(153, 115, 51, 0.85); /* Color(0.6, 0.45, 0.2, 0.85) */
	border-radius: 12px;
	overflow: hidden;
	box-sizing: border-box;
}

#bce-progress-fill {
	height: 100%;
	width: 100%;
	background-color: rgb(255, 217, 115);   /* Color(1.0, 0.85, 0.45) */
	border-radius: 10px;     /* fill_style.set_corner_radius_all(10) */
	transform-origin: left center;
	transform: scaleX(0);
	animation: bce-fill-slow 20s linear forwards;
	will-change: transform;
}

#bce-progress-fill.js-driven {
	animation: none;
	transition: transform 0.4s linear;
}

/* 分段递增：每10%耗时递增，总20秒到90%上限
   0-10%: 0.8s, 10-20%: 1.0s, 20-30%: 1.3s, 30-40%: 1.6s,
   40-50%: 2.0s, 50-60%: 2.4s, 60-70%: 2.9s, 70-80%: 3.5s, 80-90%: 4.5s */
@keyframes bce-fill-slow {
	0%      { transform: scaleX(0); }
	4%      { transform: scaleX(0.10); }
	9%      { transform: scaleX(0.20); }
	15.5%   { transform: scaleX(0.30); }
	23.5%   { transform: scaleX(0.40); }
	33.5%   { transform: scaleX(0.50); }
	45.5%   { transform: scaleX(0.60); }
	60%     { transform: scaleX(0.70); }
	77.5%   { transform: scaleX(0.80); }
	100%    { transform: scaleX(0.90); }
}

/* 进度条上覆盖的「加载中...XX%」 ——
   数字胶卷：把 0..100 全部预渲染成 101 行，每行高度严格等于进度条内部高度（20px），
   用 transform: translateY 卷动。和进度条 fill 一样走 GPU 合成线程，
   主线程被 wasm 阻塞时仍匀速，与进度条同步。 */
#bce-progress-text {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	bottom: 0;
	overflow: hidden;
	color: white;
	font-family: 'ZCOOLKuaiLe', 'Microsoft YaHei', 'PingFang SC', sans-serif;
	font-size: 14px;
	pointer-events: none;
}

#bce-progress-tape {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	transform: translateY(0);
	animation: bce-tape-slow 20s linear forwards;
	will-change: transform;
}

#bce-progress-tape.js-driven {
	animation: none;
}

@keyframes bce-tape-slow {
	0%      { transform: translateY(0); animation-timing-function: steps(10); }
	4%      { transform: translateY(-200px); animation-timing-function: steps(10); }
	9%      { transform: translateY(-400px); animation-timing-function: steps(10); }
	15.5%   { transform: translateY(-600px); animation-timing-function: steps(10); }
	23.5%   { transform: translateY(-800px); animation-timing-function: steps(10); }
	33.5%   { transform: translateY(-1000px); animation-timing-function: steps(10); }
	45.5%   { transform: translateY(-1200px); animation-timing-function: steps(10); }
	60%     { transform: translateY(-1400px); animation-timing-function: steps(10); }
	77.5%   { transform: translateY(-1600px); animation-timing-function: steps(10); }
	100%    { transform: translateY(-1800px); }
}

#bce-progress-tape > div {
	height: 20px;            /* = 进度条 24px - 上下 border 各 2px */
	line-height: 20px;
	text-align: center;
	-webkit-text-stroke: 0.6px rgba(0,0,0,0.9);
	text-shadow:
		1px 1px 0 rgba(0,0,0,0.9),
		-1px 1px 0 rgba(0,0,0,0.9),
		1px -1px 0 rgba(0,0,0,0.9),
		-1px -1px 0 rgba(0,0,0,0.9);
}

/* tip 文字：复刻 LoadingScreen.gd —— ZCOOLKuaiLe 32px 金色描边阴影，
   位置在进度条上方约 80px（LoadingScreen 中是 vp.y * 0.62 - 70） */
#bce-tip {
	position: absolute;
	left: 50%;
	bottom: 110px;
	transform: translateX(-50%);
	width: min(90vw, 1100px);
	color: rgb(255, 240, 166);
	font-family: 'ZCOOLKuaiLe', 'Microsoft YaHei', 'PingFang SC', sans-serif;
	font-size: clamp(20px, 4.4vh, 36px);
	text-align: center;
	line-height: 1.45;
	-webkit-text-stroke: 1.2px rgba(0,0,0,0.95);
	text-shadow:
		2px 3px 0 rgba(0,0,0,0.55),
		1px 1px 0 rgba(0,0,0,0.95),
		-1px 1px 0 rgba(0,0,0,0.95),
		1px -1px 0 rgba(0,0,0,0.95),
		-1px -1px 0 rgba(0,0,0,0.95);
	pointer-events: none;
	white-space: pre-line;
}
#bce-tip .hl { color: #ff3333; }
#bce-tip .small {
	display: block;
	margin-top: 0.6em;
	font-size: 1em;
	color: inherit;
}

/* loader.handing-off 时一起淡出 tip */
#bce-loader.handing-off #bce-tip {
	opacity: 0;
	transition: opacity 0.2s ease;
}

/* 加载完成 → 进度条 + tip 消失，按钮淡入 */
#bce-loader.ready #bce-progress-pos,
#bce-loader.ready #bce-tip { display: none; }
#bce-loader.ready #bce-start-btn { opacity: 1; pointer-events: auto; }

/* 开始游戏按钮 —— TitleScreen.gd 中 STRETCH_KEEP_ASPECT_CENTERED 让 256x256 PNG 在 448x182 框内按高度 fit，
   实际视觉是 182x182 正方形 → 25.3vh */
#bce-start-btn {
	position: absolute;
	top: 81.8%;
	left: 50%;
	width: 25.3vh;
	height: auto;
	transform: translate(-50%, -50%) scale(1);
	cursor: pointer;
	opacity: 0;
	pointer-events: none;
	transition: opacity 0.6s ease, transform 0.15s ease, filter 0.15s ease;
	user-select: none;
	-webkit-user-drag: none;
	animation: bce-btn-idle 2.2s ease-in-out infinite;
}

#bce-start-btn:hover {
	transform: translate(-50%, -50%) scale(1.07);
	filter: brightness(1.1) drop-shadow(0 0 18px rgba(255, 220, 120, 0.6));
}

#bce-start-btn:active {
	transform: translate(-50%, -50%) scale(0.93);
}

@keyframes bce-btn-idle {
	0%, 100% { filter: brightness(1.0); }
	50%      { filter: brightness(0.85); }
}

/* 进入"等待 Godot LoadingScreen 显示"状态：按钮+进度条+logo 一起隐藏，
   但 loader 整体（背景）保持，避免点击瞬间灰屏 */
#bce-loader.handing-off #bce-start-btn,
#bce-loader.handing-off #bce-progress-pos,
#bce-loader.handing-off #bce-logo-pos {
	opacity: 0;
	pointer-events: none;
	transition: opacity 0.2s ease;
}
</style>

<script>
(function () {
	function init() {
		var loader = document.createElement('div');
		loader.id = 'bce-loader';
		var tape = '<div id="bce-progress-tape">';
		for (var i = 0; i <= 100; i++) tape += '<div>加载中...' + i + '%</div>';
		tape += '</div>';

		loader.innerHTML =
			'<div id="bce-logo-pos"><img id="bce-logo" src="loader_logo.png" alt=""></div>' +
			'<div id="bce-tip">' +
				'感谢老板举办的活动 我们会好好利用这<span class="hl">5W</span>的奖金的 ~_~' +
				'<span class="small">感谢<span class="hl">AiArt</span>和<span class="hl">AiVoice</span>团队，你们是真正的<span class="hl">MVP</span></span>' +
			'</div>' +
			'<div id="bce-progress-pos"><div id="bce-progress">' +
				'<div id="bce-progress-fill"></div>' +
				'<div id="bce-progress-text">' + tape + '</div>' +
			'</div></div>' +
			'<img id="bce-start-btn" src="loader_btn.png" alt="开始游戏">';
		document.body.insertBefore(loader, document.body.firstChild);

		window.__bce_start = 0;
		window.__bce_main_ready = 0;
		window.__bce_assets_ready = 0;
		window.__bce_download_progress = 0;

		var fill = document.getElementById('bce-progress-fill');
		var tapeEl = document.getElementById('bce-progress-tape');
		var displayedPct = 0;
		var jsPhaseStarted = false;
		var FINISH_SPEED = 0.5;
		var MIN_DURATION_MS = 5000;
		var pageStartTime = performance.now();

		function setProgress(ratio) {
			if (ratio < 0) ratio = 0;
			if (ratio > 1) ratio = 1;
			fill.style.transform = 'scaleX(' + ratio + ')';
			var pct = Math.floor(ratio * 100);
			if (pct !== displayedPct) {
				displayedPct = pct;
				tapeEl.style.transform = 'translateY(-' + (pct * 20) + 'px)';
			}
		}

		function getCSSProgress() {
			var s = getComputedStyle(fill).transform;
			if (!s || s === 'none') return 0;
			var m = s.match(/matrix\(([^,]+)/);
			return m ? parseFloat(m[1]) : 0;
		}

		function startJSPhase() {
			if (jsPhaseStarted) return;
			jsPhaseStarted = true;
			var currentRatio = getCSSProgress();
			fill.classList.add('js-driven');
			tapeEl.classList.add('js-driven');
			fill.style.transform = 'scaleX(' + currentRatio + ')';
			tapeEl.style.transform = 'translateY(-' + (Math.floor(currentRatio * 100) * 20) + 'px)';
			var finishStart = performance.now();
			var startRatio = currentRatio;
			var remaining = 1 - startRatio;
			var finishDuration = remaining / FINISH_SPEED * 1000;

			var finishTimer = setInterval(function () {
				var elapsed = performance.now() - finishStart;
				var ratio = startRatio + (elapsed / finishDuration) * remaining;
				if (ratio >= 1) {
					clearInterval(finishTimer);
					setProgress(1);
					setTimeout(function () { loader.classList.add('ready'); }, 200);
				} else {
					setProgress(ratio);
				}
			}, 30);
		}

		// CSS 动画 20 秒到 90% 后，每秒 +1% 慢爬到 98%
		var slowCrawlStarted = false;
		var slowCrawlRatio = 0.90;
		setTimeout(function () {
			if (jsPhaseStarted) return;
			slowCrawlStarted = true;
			fill.classList.add('js-driven');
			tapeEl.classList.add('js-driven');
			fill.style.transform = 'scaleX(0.9)';
			tapeEl.style.transform = 'translateY(-1800px)';
			var crawlTimer = setInterval(function () {
				if (jsPhaseStarted) { clearInterval(crawlTimer); return; }
				slowCrawlRatio += 0.01;
				if (slowCrawlRatio >= 0.98) {
					slowCrawlRatio = 0.98;
					clearInterval(crawlTimer);
				}
				setProgress(slowCrawlRatio);
			}, 1000);
		}, 20000);

		function doFinish() {
			var cur = slowCrawlStarted ? slowCrawlRatio : getCSSProgress();
			jsPhaseStarted = true;
			fill.classList.add('js-driven');
			tapeEl.classList.add('js-driven');
			fill.style.transform = 'scaleX(' + cur + ')';
			tapeEl.style.transform = 'translateY(-' + (Math.floor(cur * 100) * 20) + 'px)';

			var elapsed = performance.now() - pageStartTime;
			var timeLeft = Math.max(0, MIN_DURATION_MS - elapsed);
			var remaining = 1 - cur;
			var finishDuration = Math.max(timeLeft, remaining / FINISH_SPEED * 1000);

			var finishStart = performance.now();
			var finishTimer = setInterval(function () {
				var e = performance.now() - finishStart;
				var ratio = cur + (e / finishDuration) * remaining;
				if (ratio >= 1) {
					clearInterval(finishTimer);
					setProgress(1);
					setTimeout(function () { loader.classList.add('ready'); }, 200);
				} else {
					setProgress(ratio);
				}
			}, 30);
		}

		// 轮询真实下载进度，完成后立刻接管，按剩余时间匀速跑到 100%
		var checkTimer = setInterval(function () {
			var dl = window.__bce_download_progress || 0;
			var assetsReady = window.__bce_assets_ready || 0;
			var realProgress = dl * 0.8 + assetsReady * 0.2;
			if (realProgress >= 1) {
				clearInterval(checkTimer);
				doFinish();
			}
		}, 100);

		// 点击开始游戏
		document.getElementById('bce-start-btn').addEventListener('click', function () {
			if (window.__bce_start) return;
			window.__bce_start = 1;
			var clickAt = performance.now();
			loader.classList.add('handing-off');

			var handoffTimer = setInterval(function () {
				var ready = window.__bce_main_ready === 1;
				var timeout = performance.now() - clickAt > 8000;
				if (ready || timeout) {
					clearInterval(handoffTimer);
					loader.classList.add('fade-out');
					setTimeout(function () { loader.remove(); }, 500);
				}
			}, 50);
		});
	}

	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', init);
	} else {
		init();
	}
})();
</script>
